[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hk-traffic-pipeline"
version = "0.1.0"
description = "Hong Kong road traffic (Transport Department open data): PySpark pipeline from raw XML archives to analytics tables"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyspark==3.5.3",
    "psycopg2-binary>=2.9",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
hktraffic = "hktraffic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hktraffic = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["spark: needs PySpark and a Java runtime", "db: needs PostgreSQL"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045"]
